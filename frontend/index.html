<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/labels.css">
  <link rel="stylesheet" href="/css/decisions.css">
  <link rel="stylesheet" href="/css/records.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/">FlowUp</a>

    <nav class="main-nav" aria-label="Main">
      <a href="#briefing">Briefing</a>
      <a href="#stock">Stock</a>
      <a href="#orders">Orders</a>
      <a href="#activity">Activity</a>
    </nav>

    <div class="nametag-area">
      <span class="nametag-caption">Signed in as</span>
      <div id="user-switcher" class="user-switcher" role="group" aria-label="Switch demo user"></div>
    </div>
  </header>

  <main id="app" class="page">
    <p class="status">Loading the shop briefing...</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/js/labels.js"></script>
  <script src="/js/records.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
